name: ehs-safety-tests
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: ['sunhaven/main', 'codex/**']
  pull_request:
    branches: ['sunhaven/main']
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.6.1'
            requirements: requirements_test.txt
          - ha: '2026.9.4'
            requirements: requirements_test_live_compat.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.5'
      - run: pip install -r '${{ matrix.requirements }}'
      - run: pip check
      - name: Verify exact resolved HA version
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: python -c "import importlib.metadata as m,os; assert m.version('homeassistant') == os.environ['EXPECTED_HA']"
      - run: python -m pytest tests/components/ehs_sentinel -q --timeout=30
